name: "units-test"
on:
  pull_request:
  push:
    branches:
      - main
      - 'releases/*'

jobs:
  # unit tests
  units:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - run: npm ci
    - run: npm test

  # test action works running from the graph
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: ./
      with:
        nexusUrl: 'https://maven.twelveiterations.com'
        repository: 'maven-releases'
        groupId: 'net.blay09.mods'
        artifactId: 'balm-common'
        version: '8.*'
